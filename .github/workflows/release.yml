name: Release

on:
  push:
    branches: [main]
    # Release tags are pushed by release-please (via the release bot App, so they trigger
    # workflows). Publishing from the tag builds exactly the released commit, and a failed
    # publish can be retried by re-running this workflow or dispatching it on the tag.
    tags: ['api-v*', 'web-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Opens or updates the release PR from conventional commits, and when that PR is merged,
  # tags the release (api-vX.Y.Z / web-vX.Y.Z) and creates the GitHub Release. The tag push
  # then runs this workflow again to publish the release.
  release-please:
    name: Release Please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      # A GitHub App token so CI runs on the release PR and the release tags trigger this
      # workflow (events from GITHUB_TOKEN don't trigger workflows).
      - name: Create release bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.bot-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.components }}
      release: ${{ steps.components.outputs.release }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changed directories
        if: github.ref_type == 'branch'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/release.yml'
            web:
              - 'web/**'
              - '.github/workflows/release.yml'

      # Release tags build only the tagged component. Branch pushes build changed
      # components, and manual runs on a branch build all of them.
      - name: Select components
        id: components
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          release=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            component=${GITHUB_REF_NAME%%-v*}
            release=${GITHUB_REF_NAME#*-v}
            case "$component" in api|web) ;; *) echo "::error::Unknown component in tag $GITHUB_REF_NAME"; exit 1 ;; esac
            if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not <component>-vX.Y.Z"
              exit 1
            fi
            manifest=$(jq -r --arg c "$component" '.[$c]' .release-please-manifest.json)
            if [ "$manifest" != "$release" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the manifest version ($manifest) at ${GITHUB_SHA::7}"
              exit 1
            fi
            components=$(jq -cn --arg c "$component" '[$c]')
          elif [ "$MANUAL" = true ]; then
            components='["api","web"]'
          else
            components=$CHANGED
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "Components: $components, release: ${release:-none}"

  publish:
    name: Publish ${{ matrix.component }}
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    concurrency:
      group: release-images-${{ matrix.component }}
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v6

      # Release tags build as X.Y.Z; other builds report the last release plus the commit.
      - name: Determine version
        id: version
        env:
          COMPONENT: ${{ matrix.component }}
          RELEASE: ${{ needs.changes.outputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then
            version=$RELEASE
          else
            version="$(jq -r --arg c "$COMPONENT" '.[$c]' .release-please-manifest.json)+sha.${GITHUB_SHA::7}"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/llm-chat-${{ matrix.component }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.release }},enable=${{ steps.version.outputs.release != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.release }},enable=${{ steps.version.outputs.release != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Save image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/llm-chat-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p artifacts
          echo "${IMAGE}@${DIGEST}" > "artifacts/${COMPONENT}.txt"

      - name: Upload image digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.component }}
          path: artifacts/${{ matrix.component }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Record image digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published Image"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "  - \`$tag\`"
            done <<< "$TAGS"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pin released images in the component's chart via a PR. Uses a GitHub App token
      # so CI runs on the PR (events from GITHUB_TOKEN don't trigger workflows).
      - name: Create release bot token
        if: steps.version.outputs.release != ''
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Check out main for chart update
        if: steps.version.outputs.release != ''
        uses: actions/checkout@v6
        with:
          ref: main
          path: chart-update
          token: ${{ steps.bot-token.outputs.token }}

      - name: Pin image in chart
        if: steps.version.outputs.release != ''
        working-directory: chart-update/charts/${{ matrix.component }}
        env:
          TAG: ${{ steps.version.outputs.release }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # sed keeps comments and blank lines intact; yq then verifies the result.
          sed -i -E "s|^(  tag: ).*|\1$TAG|; s|^(  digest: ).*|\1$DIGEST|" values.yaml
          [ "$(yq '.image.tag' values.yaml)" = "$TAG" ] && [ "$(yq '.image.digest' values.yaml)" = "$DIGEST" ]
          if git diff --quiet -- values.yaml; then
            echo "Chart already pins $DIGEST"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$(yq '.version' Chart.yaml)"
          next="$major.$minor.$((patch + 1))"
          sed -i -E "s|^version: .*|version: $next|; s|^appVersion: .*|appVersion: \"$TAG\"|" Chart.yaml
          [ "$(yq '.version' Chart.yaml)" = "$next" ]

      - name: Open chart update PR
        if: steps.version.outputs.release != ''
        uses: peter-evans/create-pull-request@v8
        with:
          path: chart-update
          token: ${{ steps.bot-token.outputs.token }}
          branch: bot/pin-${{ matrix.component }}-image
          delete-branch: true
          commit-message: "chore(charts): pin ${{ matrix.component }} image to ${{ steps.version.outputs.release }}"
          title: "chore(charts): pin ${{ matrix.component }} image to ${{ steps.version.outputs.release }}"
          body: |
            Pins `charts/${{ matrix.component }}` to release [${{ matrix.component }}-v${{ steps.version.outputs.release }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ matrix.component }}-v${{ steps.version.outputs.release }}) (built from ${{ github.sha }}) and bumps the chart's patch version.

            - Digest: `${{ steps.build.outputs.digest }}`
            - Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Merging publishes the new chart version to `oci://ghcr.io/${{ github.repository_owner }}/charts/llm-chat-${{ matrix.component }}`.
