
name: Release Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      components: ${{ github.event_name == 'workflow_dispatch' && '["api","web"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changed directories
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/release.yml'
            web:
              - 'web/**'
              - '.github/workflows/release.yml'

  publish:
    name: Publish ${{ matrix.component }}
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    concurrency:
      group: release-images-${{ matrix.component }}
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/llm-chat-${{ matrix.component }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Save image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/llm-chat-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p artifacts
          echo "${IMAGE}@${DIGEST}" > "artifacts/${COMPONENT}.txt"

      - name: Upload image digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.component }}
          path: artifacts/${{ matrix.component }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Record image digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published Image"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "  - \`$tag\`"
            done <<< "$TAGS"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pin the new image in the component's chart via a PR. Uses a GitHub App token
      # so CI runs on the PR (events from GITHUB_TOKEN don't trigger workflows).
      - name: Create release bot token
        if: github.ref == 'refs/heads/main'
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Check out main for chart update
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          ref: main
          path: chart-update
          token: ${{ steps.bot-token.outputs.token }}

      - name: Pin image in chart
        if: github.ref == 'refs/heads/main'
        working-directory: chart-update/charts/${{ matrix.component }}
        env:
          TAG: sha-${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # sed keeps comments and blank lines intact; yq then verifies the result.
          sed -i -E "s|^(  tag: ).*|\1$TAG|; s|^(  digest: ).*|\1$DIGEST|" values.yaml
          [ "$(yq '.image.tag' values.yaml)" = "$TAG" ] && [ "$(yq '.image.digest' values.yaml)" = "$DIGEST" ]
          if git diff --quiet -- values.yaml; then
            echo "Chart already pins $DIGEST"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$(yq '.version' Chart.yaml)"
          next="$major.$minor.$((patch + 1))"
          sed -i -E "s|^version: .*|version: $next|; s|^appVersion: .*|appVersion: \"$TAG\"|" Chart.yaml
          [ "$(yq '.version' Chart.yaml)" = "$next" ]

      - name: Open chart update PR
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v8
        with:
          path: chart-update
          token: ${{ steps.bot-token.outputs.token }}
          branch: bot/pin-${{ matrix.component }}-image
          delete-branch: true
          commit-message: "chore(charts): pin ${{ matrix.component }} image to sha-${{ github.sha }}"
          title: "chore(charts): pin ${{ matrix.component }} image to sha-${{ github.sha }}"
          body: |
            Pins `charts/${{ matrix.component }}` to the image built from ${{ github.sha }} and bumps the chart's patch version.

            - Digest: `${{ steps.build.outputs.digest }}`
            - Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Merging publishes the new chart version to `oci://ghcr.io/${{ github.repository_owner }}/charts/llm-chat-${{ matrix.component }}`.
