services:
  api:
    build:
      context: ./api
      target: dev
    ports:
      - "8000:8000"
    volumes:
      # api/.env (if present) is picked up through this mount.
      - ./api:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./web:/app
      # Keep the container's node_modules instead of the host's.
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  # Optional voice input: `docker compose --profile voice up`, with STT_URL=http://stt:8000 in api/.env.
  stt:
    profiles: [voice]
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    ports:
      - "8001:8000"
    environment:
      # Downloads the model on first start; it is cached in the stt-models volume.
      PRELOAD_MODELS: '["Systran/faster-distil-whisper-small.en"]'
      # Works around speaches-ai/speaches#559 (realtime transcription fails in 0.9.0-rc.3).
      LOOPBACK_HOST_URL: http://127.0.0.1:8000
      ENABLE_UI: "false"
      STT_MODEL_TTL: "-1"
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface

volumes:
  stt-models:
