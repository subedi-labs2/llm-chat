# Resources are named after the Helm release (release "web" creates Service "web").
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/subedi-labs2/llm-chat-web
  # tag and digest are pinned to each release by the Release workflow; the digest is what gets pulled.
  tag: sha-b211976842b248e5efb960807297379d9e1fcb7d
  digest: sha256:8ddfbc1662c84e41094df833f129dc5f65eb4a9284c5d33d42dfba2ee583e4f6
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Where nginx proxies /api requests. Must be a fully qualified name because nginx's
# resolver ignores DNS search domains. Templated, so the default follows the release namespace.
apiUpstream: "http://api.{{ .Release.Namespace }}.svc.cluster.local:8000"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Leave empty to match any host (e.g. http://localhost on k3d).
  host: ""
  tls: []

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
