# Resources are named after the Helm release (release "web" creates Service "web").
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/subedi-labs2/llm-chat-web
  # tag and digest are updated by the Release Images workflow; the digest is what gets pulled.
  tag: sha-9e0bfc9a4fdeccd0002fb30a458e62da26f8db3e
  digest: sha256:ab97753a34f65d8a8dd5f89230f036a7f86616a3963759fd3705b4c5d092e5f5
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Where nginx proxies /api requests. Must be a fully qualified name because nginx's
# resolver ignores DNS search domains. Templated, so the default follows the release namespace.
apiUpstream: "http://api.{{ .Release.Namespace }}.svc.cluster.local:8000"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Leave empty to match any host (e.g. http://localhost on k3d).
  host: ""
  tls: []

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
