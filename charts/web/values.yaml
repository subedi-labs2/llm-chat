# Resources are named after the Helm release (release "web" creates Service "web").
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/subedi-labs2/llm-chat-web
  # tag and digest are pinned to each release by the Release workflow; the digest is what gets pulled.
  tag: 0.2.0
  digest: sha256:4bae78559bdbf879bbc97f54014240c0b319a5cc11e83d26c89bf3f8d12f6aae
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Where nginx proxies /api requests. Must be a fully qualified name because nginx's
# resolver ignores DNS search domains. Templated, so the default follows the release namespace.
apiUpstream: "http://api.{{ .Release.Namespace }}.svc.cluster.local:8000"

# Show the light/dark mode toggle in the header. When off, the app stays in light mode.
themeToggle: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Leave empty to match any host (e.g. http://localhost on k3d).
  host: ""
  tls: []

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
