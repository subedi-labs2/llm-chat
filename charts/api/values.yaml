# Resources are named after the Helm release (release "api" creates Service "api").
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/subedi-labs2/llm-chat-api
  # tag and digest are updated by the Release Images workflow; the digest is what gets pulled.
  tag: sha-9e0bfc9a4fdeccd0002fb30a458e62da26f8db3e
  digest: sha256:122e5ecbe6e75fc7d5638ecfe0e3f789b49550ed0a4fc06ef4ed5c37119e65b3
  pullPolicy: IfNotPresent

imagePullSecrets: []

gemini:
  # Name of an existing Secret containing the Gemini API key. /api/chat fails without it.
  existingSecret: ""
  secretKey: GEMINI_API_KEY

# Additional environment variables, e.g. GEMINI_MODEL (see api/.env.example).
extraEnv: []

service:
  type: ClusterIP
  port: 8000

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
