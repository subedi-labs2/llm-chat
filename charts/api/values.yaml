# Resources are named after the Helm release (release "api" creates Service "api").
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/subedi-labs2/llm-chat-api
  # tag and digest are updated by the Release Images workflow; the digest is what gets pulled.
  tag: sha-b211976842b248e5efb960807297379d9e1fcb7d
  digest: sha256:82bb19d3314e84dd34f2dd29f901ebc468cbfe789a03391b420ca02b3fad69af
  pullPolicy: IfNotPresent

imagePullSecrets: []

gemini:
  # Name of an existing Secret containing the Gemini API key. /api/chat fails without it.
  existingSecret: ""
  secretKey: GEMINI_API_KEY

# Additional environment variables, e.g. GEMINI_MODEL (see api/.env.example).
extraEnv: []

service:
  type: ClusterIP
  port: 8000

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
