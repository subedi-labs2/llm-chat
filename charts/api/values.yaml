# Resources are named after the Helm release (release "api" creates Service "api").
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/subedi-labs2/llm-chat-api
  # tag and digest are pinned to each release by the Release workflow; the digest is what gets pulled.
  tag: 0.2.0
  digest: sha256:1441d5384e462520f30cbfc9d65cbdeb9f70a38ab434191a29f0d245a126683a
  pullPolicy: IfNotPresent

imagePullSecrets: []

gemini:
  # Name of an existing Secret containing the Gemini API key. /api/chat fails without it.
  existingSecret: ""
  secretKey: GEMINI_API_KEY

# Additional environment variables, e.g. GEMINI_MODEL (see api/.env.example).
extraEnv: []

service:
  type: ClusterIP
  port: 8000

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
