gemini:
  existingSecret: llm-chat-api

# Non-secret settings (see api/README.md). GEMINI_API_KEY comes from the Secret above.
extraEnv:
  - name: AGENT_BACKEND
    value: pydantic_ai
  # Shows the Pydantic AI / LangChain toggle in the web header. The app has no
  # login, so any visitor can switch backends.
  - name: ALLOW_BACKEND_SELECTION
    value: "true"
  - name: GEMINI_MODEL
    value: gemini-3.8-flash
  - name: GEMINI_FALLBACK_MODELS
    value: '["gemini-3.6-flash","gemini-3.5-flash-lite"]'
  - name: GEMINI_RETRY_ATTEMPTS
    value: "2"
  # Voice input through the stt release (stt-values.yaml). Remove STT_URL to hide the mic button.
  - name: STT_URL
    value: http://stt:8000
  # Must match the model in stt-values.yaml.
  - name: STT_MODEL
    value: Systran/faster-distil-whisper-small.en
