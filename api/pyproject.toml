[project]
name = "safety-assistant-api"
version = "0.1.0"
description = "API for the Consumer Product & Vehicle Safety Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "httpx>=0.28.1,<0.29",
    "pydantic-ai-slim[openai]>=2.64.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "uvicorn[standard]>=0.38.0,<0.39",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "ruff>=0.14.0,<0.15",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
